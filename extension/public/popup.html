<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小站自动填写</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img class="mark" src="littledock-otter.png" alt="" aria-hidden="true" draggable="false" /><div><h1>小站 · LittleDock</h1><p>本机账号 · 按网站填写</p></div><button id="refresh" class="icon" aria-label="刷新连接状态" title="刷新连接状态">↻</button></header>
<main><p id="status" role="status">正在读取…</p><p id="site" class="site"></p>
<form id="pair-form" hidden><label for="pair-code">浏览器配对码</label><textarea id="pair-code" rows="3" placeholder="在小站 → 全局设置 → 浏览器自动填写中生成" autocomplete="off" spellcheck="false" required></textarea><p class="hint">配对码两分钟内有效，每个浏览器单独配对。</p><button class="primary" type="submit">配对此浏览器</button></form>
<form id="fill-form" hidden><label for="accounts">选择账号</label><select id="accounts"></select><label class="check"><input id="automatic" type="checkbox">以后在此网站自动填写</label><p class="hint">同一域名的 HTTP / HTTPS 共用账号，非默认端口单独匹配。点击填写即授权此浏览器使用所选账号；不会提交登录或覆盖已有输入。</p><button class="primary" type="submit">允许并填写</button></form>
<button id="capture-page" class="secondary" hidden>收藏当前网页</button>
<form id="save-form" autocomplete="off" hidden>
  <h2>保存当前网页</h2><p id="capture-hint" class="hint"></p>
  <label for="save-target">保存到</label><select id="save-target"></select>
  <label for="save-name">名称</label><input id="save-name" type="text" maxlength="60" required>
  <label for="save-url">网址</label><input id="save-url" type="url" maxlength="2048" required>
  <label class="check"><input id="save-login" type="checkbox">同时保存账号密码</label>
  <div class="credential-fields"><div><label for="save-username">账号</label><input id="save-username" type="text" maxlength="256" autocomplete="off" spellcheck="false"></div>
  <div><label for="save-password">密码</label><input id="save-password" type="password" maxlength="4096" autocomplete="off"></div></div>
  <p id="save-change-hint" class="hint"></p><button id="save-submit" class="primary" type="submit">保存到小站</button>
  <button id="cancel-save" class="text-button" type="button">取消</button>
</form>
<p id="error" role="alert"></p><div id="paired-tools" hidden><button id="forget" class="text-button" title="删除此浏览器保存的配对身份">断开配对</button></div></main>
<footer><span>仅连接 127.0.0.1</span><button id="open-webnav" class="text-button">打开小站 ↗</button></footer><script src="popup.js"></script></body></html>
